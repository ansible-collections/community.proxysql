---
name: Feature request
description: Suggest an idea for this project

body:
  - type: markdown
    attributes:
      value: |
        ⚠ Verify first that your issue is not [already reported on GitHub][issue search].
        Also test if the latest release and devel branch are affected too.
        Complete all sections as described, this form is processed automatically.

        [issue search]: https://github.com/ansible-collections/community.proxysql/search?q=is%3Aissue&type=issues

  - type: textarea
    attributes:
      label: Summary
      description: Describe the new feature or improvement briefly below.
      placeholder: >-
        I am trying to do X with the collection from the main branch on GitHub
        and I think that implementing feature Y would be very helpful for me and
        other users of community.proxysql because of Z.
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Issue Type
      options:
        - Feature Idea
    validations:
      required: true

  - type: input
    attributes:
      label: Component Name
      description: >-
        Write the short name of the module or plugin, or which other part(s) of
        the collection this feature affects. Do not include community.proxysql.
      placeholder: proxysql_info, proxysql_query_rules, proxysql_mysql_users
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Information
      description: |
        Describe how the feature would be used, why it is needed and what it
        would solve.

        **HINT:** You can paste https://gist.github.com links for larger files.
      value: |
        <!--- Paste example playbooks or commands between quotes below -->
        ```yaml (paste below)

        ```
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Code of Conduct
      description: |
        Read the [Ansible Code of Conduct](https://docs.ansible.com/projects/ansible/latest/community/code_of_conduct.html?utm_medium=github&utm_source=issue_form--ansible-collections) first.
      options:
        - label: I agree to follow the Ansible Code of Conduct
          required: true
...
